<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f6f2">
<meta name="description" content="마인크래프트 아이템 조합법을 한국어로 검색하세요.">
<title>마크 조합법</title>

<style>
:root {
  --bg: #f5f6f2;
  --card: #fff;
  --text: #20251e;
  --muted: #858b7d;
  --green: #d5f477;
  --border: #e5e8df;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
}
button, input { font: inherit; }
button { color: inherit; }

header {
  height: 66px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: #ffffffc9;
  border-bottom: 1px solid var(--border);
}
.logo { font-weight: 900; font-size: 19px; letter-spacing: -1px; }
.logo span {
  background: var(--green);
  padding: 6px 9px;
  border-radius: 9px;
  margin-right: 6px;
}
.header-small { color: var(--muted); font-size: 11px; }

main {
  width: min(720px, calc(100% - 32px));
  margin: auto;
  padding: 75px 0 55px;
}
.hero { text-align: center; margin-bottom: 30px; }
.badge {
  display: inline-block;
  background: #e9f4cf;
  color: #55751c;
  padding: 7px 12px;
  border-radius: 30px;
  font-size: 11px;
  font-weight: 850;
  margin-bottom: 17px;
}
h1 {
  font-size: clamp(34px, 8vw, 52px);
  letter-spacing: -2.5px;
  margin: 0;
  line-height: 1.2;
}
h1 span { color: #789c29; }
.subtitle {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
  margin-top: 14px;
}

.search-wrap { position: relative; z-index: 5; }
.search-box {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 7px 8px 7px 17px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 17px;
  box-shadow: 0 8px 28px #2430140b;
}
.search-box:focus-within { border-color: #b4d65c; }
.search-icon { font-size: 23px; color: #858b7d; }
#search {
  width: 100%;
  min-width: 0;
  height: 42px;
  border: 0;
  outline: none;
  background: transparent;
  font-size: 15px;
}
.clear {
  border: 0;
  border-radius: 10px;
  background: #f1f3ed;
  width: 35px;
  height: 35px;
  cursor: pointer;
}
.suggestions {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  display: none;
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 7px;
  box-shadow: 0 15px 40px #141e0a18;
  max-height: 330px;
  overflow-y: auto;
}
.suggestions.show { display: block; }

.suggestion {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  background: white;
  border: 0;
  border-radius: 11px;
  text-align: left;
  cursor: pointer;
}
.suggestion:hover { background: #f4f8eb; }
.suggestion strong { font-size: 13px; }
.suggestion small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 3px;
}
.item-img {
  width: 43px;
  height: 43px;
  object-fit: contain;
  image-rendering: pixelated;
  flex-shrink: 0;
}
.suggestion .arrow { margin-left: auto; color: #9aa08f; }

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 850;
  margin: 29px 2px 13px;
}
.section-title small { color: var(--muted); font-weight: 500; }

.quick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.quick-item {
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 14px 4px 12px;
  cursor: pointer;
  transition: .15s;
}
.quick-item:hover {
  border-color: #b4d65c;
  transform: translateY(-2px);
}
.quick-item img {
  display: block;
  width: 46px;
  height: 46px;
  object-fit: contain;
  image-rendering: pixelated;
  margin: 0 auto 8px;
}
.quick-item span {
  display: block;
  font-size: 10px;
  font-weight: 800;
  line-height: 1.5;
}

.results { display: none; margin-top: 32px; }
.results.show { display: block; }
.results-heading { font-size: 18px; font-weight: 900; margin-bottom: 14px; }
.results-heading small { font-size: 11px; color: var(--muted); font-weight: 500; }
.result-list { display: grid; gap: 9px; }
.result-card {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: white;
  text-align: left;
  cursor: pointer;
}
.result-card:hover { border-color: #b4d65c; }
.result-card .item-img { width: 51px; height: 51px; }
.result-info { flex: 1; }
.result-info strong { font-size: 14px; }
.result-info p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
.result-card .arrow { color: #8e9684; font-size: 20px; }
.empty {
  padding: 26px 16px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: white;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
  line-height: 1.8;
}

.recipe {
  display: none;
  margin-top: 24px;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: white;
}
.recipe.show { display: block; }
.recipe-top { display: flex; align-items: center; gap: 13px; }
.recipe-top .item-img { width: 62px; height: 62px; }
.recipe h2 { font-size: 20px; margin: 0 0 5px; }
.recipe-desc { color: var(--muted); font-size: 11px; }
.close {
  margin-left: auto;
  align-self: flex-start;
  border: 0;
  background: #f1f3ed;
  padding: 8px 10px;
  border-radius: 9px;
  cursor: pointer;
}
.recipe h3 { font-size: 13px; margin: 25px 0 12px; }

.crafting {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 17px;
  padding: 16px 8px;
  background: #f6f8f2;
  border-radius: 15px;
}
.craft-grid {
  display: grid;
  grid-template-columns: repeat(3, 46px);
  gap: 4px;
}
.slot {
  width: 46px;
  height: 46px;
  background: #e5e9df;
  border: 1px solid #d6ddcd;
  border-radius: 5px;
  display: grid;
  place-items: center;
}
.slot img {
  width: 36px;
  height: 36px;
  object-fit: contain;
  image-rendering: pixelated;
}
.craft-arrow { font-size: 23px; color: #7c8c60; }
.output { text-align: center; font-size: 10px; font-weight: 800; }
.output .slot { width: 56px; height: 56px; background: #e4edcf; margin-bottom: 5px; }
.output img { width: 44px; height: 44px; }

.material-list { display: grid; gap: 8px; }
.material {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  background: #f8f9f5;
  border-radius: 10px;
  font-size: 12px;
}
.material img {
  width: 32px;
  height: 32px;
  object-fit: contain;
  image-rendering: pixelated;
}
.material .count { margin-left: auto; color: var(--muted); }

.note {
  margin-top: 16px;
  padding: 12px;
  background: #f5f7ef;
  border-radius: 10px;
  color: #737b68;
  font-size: 11px;
  line-height: 1.8;
}
.back {
  margin-top: 14px;
  padding: 10px 13px;
  background: var(--green);
  border: 0;
  border-radius: 10px;
  font-weight: 800;
  cursor: pointer;
}

footer {
  border-top: 1px solid var(--border);
  padding: 25px 15px 35px;
  text-align: center;
  color: #92988a;
  font-size: 10px;
  line-height: 1.9;
}
footer a { color: inherit; }

@media (max-width: 420px) {
  main { padding-top: 58px; }
  header { padding: 0 14px; }
  .header-small { font-size: 10px; }
  .quick-grid { gap: 6px; }
  .quick-item img { width: 40px; height: 40px; }
  .quick-item span { font-size: 9px; }
  .craft-grid { grid-template-columns: repeat(3, 38px); gap: 3px; }
  .slot { width: 38px; height: 38px; }
  .slot img { width: 31px; height: 31px; }
  .crafting { gap: 11px; }
  .output .slot { width: 47px; height: 47px; }
  .output img { width: 38px; height: 38px; }
  .recipe { padding: 15px; }
}
</style>
</head>

const $ = id => document.getElementById(id);

function imageUrl(id) {
  return texture(id);
}

function makeImage(id, className="item-img") {
  const img = document.createElement("img");
  img.className = className;
  img.src = imageUrl(id);
  img.alt = id;
  img.loading = "lazy";
  img.onerror = () => {
    img.style.visibility = "hidden";
    img.alt = "이미지를 불러올 수 없습니다";
  };
  return img;
}

function normalize(value) {
  return value.toLowerCase().replace(/\s+/g, "")
    .replace(/[·._-]/g, "");
}

function findMatches(query) {
  const q = normalize(query);
  if (!q) return [];

  return items.filter(item =>
    [item.name, ...item.aliases, item.id]
      .some(term => normalize(term).includes(q))
  );
}

function makeSuggestion(item) {
  const button = document.createElement("button");
  button.className = "suggestion";
  button.append(makeImage(item.id));

  const text = document.createElement("span");
  const strong = document.createElement("strong");
  strong.textContent = item.name;

  const small = document.createElement("small");
  small.textContent = item.desc;

  text.append(strong, small);
  button.append(text);

  const arrow = document.createElement("span");
  arrow.className = "arrow";
  arrow.textContent = "↗";
  button.append(arrow);

  button.addEventListener("click", () => showRecipe(item));
  return button;
}

function renderSuggestions(query) {
  suggestions.replaceChildren();

  if (!query.trim()) {
    suggestions.classList.remove("show");
    return;
  }

  const matches = findMatches(query).slice(0, 7);

  if (!matches.length) {
    const empty = document.createElement("div");
    empty.className = "suggestion";
    empty.textContent = "검색 결과가 없어요. 다른 이름으로 검색해 보세요.";
    suggestions.append(empty);
  } else {
    matches.forEach(item => suggestions.append(makeSuggestion(item)));
  }

  suggestions.classList.add("show");
}

function renderQuickItems() {
  const ids = ["crafting_table", "torch", "diamond_pickaxe", "chest"];
  const grid = $("quickGrid");

  ids.forEach(id => {
    const item = items.find(x => x.id === id);
    const button = document.createElement("button");
    button.className = "quick-item";
    button.append(makeImage(item.id));

    const label = document.createElement("span");
    label.textContent = item.name;
    button.append(label);

    button.addEventListener("click", () => showRecipe(item));
    grid.append(button);
  });
}

function renderResults(query) {
  const matches = findMatches(query);
  const list = $("resultList");
  list.replaceChildren();
  $("count").textContent = `${matches.length}개`;

  if (!matches.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "찾는 아이템이 없어요. 검색어를 바꿔 보세요.";
    list.append(empty);
  } else {
    matches.forEach(item => {
      const button = document.createElement("button");
      button.className = "result-card";
      button.append(makeImage(item.id));

      const info = document.createElement("span");
      info.className = "result-info";

      const name = document.createElement("strong");
      name.textContent = item.name;

      const desc = document.createElement("p");
      desc.textContent = item.desc;

      info.append(name, desc);
      button.append(info);

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "›";
      button.append(arrow);

      button.addEventListener("click", () => showRecipe(item));
      list.append(button);
    });
  }

  results.classList.add("show");
  recipePanel.classList.remove("show");
}

function showRecipe(item) {
  search.value = item.name;
  suggestions.classList.remove("show");
  results.classList.remove("show");

  $("recipeImage").src = imageUrl(item.id);
  $("recipeImage").alt = item.name;
  $("recipeName").textContent = item.name;
  $("recipeDesc").textContent = item.desc;
  $("outputImage").src = imageUrl(item.id);
  $("outputImage").alt = item.name;
  $("note").textContent = item.note;

  const grid = $("craftGrid");
  grid.replaceChildren();

  item.grid.forEach(id => {
    const slot = document.createElement("div");
    slot.className = "slot";
    if (id) slot.append(makeImage(id, ""));
    grid.append(slot);
  });

  const materials = $("materials");
  materials.replaceChildren();

  item.materials.forEach(([id, name, count]) => {
    const row = document.createElement("div");
    row.className = "material";
    row.append(makeImage(id, ""));

    const label = document.createElement("span");
    label.textContent = name;

    const amount = document.createElement("span");
    amount.className = "count";
    amount.textContent = `× ${count}`;

    row.append(label, amount);
    materials.append(row);
  });

  recipePanel.classList.add("show");
  recipePanel.scrollIntoView({behavior:"smooth", block:"start"});
}

search.addEventListener("input", () => {
  renderSuggestions(search.value);

  if (search.value.trim()) {
    renderResults(search.value);
  } else {
    results.classList.remove("show");
    recipePanel.classList.remove("show");
  }
});

search.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    const matches = findMatches(search.value);

    if (matches.length === 1) {
      showRecipe(matches[0]);
    } else if (matches.length > 1) {
      suggestions.classList.remove("show");
      renderResults(search.value);
    }
  }

  if (event.key === "Escape") {
    suggestions.classList.remove("show");
  }
});

$("clear").addEventListener("click", () => {
  search.value = "";
  suggestions.classList.remove("show");
  results.classList.remove("show");
  recipePanel.classList.remove("show");
  search.focus();
});

$("close").addEventListener("click", () => {
  recipePanel.classList.remove("show");
});

$("back").addEventListener("click", () => {
  recipePanel.classList.remove("show");
  if (search.value.trim()) renderResults(search.value);
});

document.addEventListener("click", event => {
  if (!event.target.closest(".search-wrap")) {
    suggestions.classList.remove("show");
  }
});

renderQuickItems();
</script>
</body>
</html>
