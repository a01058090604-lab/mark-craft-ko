<style>
:root{--green:#9bea45;--green2:#6ecb35;--bg:#061018;--panel:rgba(5,15,21,.91);--line:#30434b;--white:#f6f8f4;--muted:#b5c0c6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#07121b;color:var(--white);font-family:Arial,"Noto Sans KR",system-ui,sans-serif;min-height:100vh}
button,input{font:inherit}button{color:inherit}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:
linear-gradient(180deg,rgba(3,11,22,.42),rgba(2,12,13,.45) 45%,rgba(2,12,9,.74)),
url("minecraft-night-village-background.jpeg") center/cover fixed}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,#02091055,transparent 20%,transparent 80%,#02091055)}
.topbar{height:64px;background:rgba(3,11,20,.94);border-bottom:1px solid #243847;display:flex;align-items:center;padding:0 max(22px,calc((100% - 1320px)/2));gap:42px;position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px;font-weight:950;font-size:22px;letter-spacing:-1px;text-decoration:none;white-space:nowrap}
.brand img{width:38px;height:38px;object-fit:contain;image-rendering:pixelated}
.brand b{color:var(--green)}
.nav{display:flex;align-items:center;gap:30px;height:100%;font-size:13px;font-weight:800}
.nav a{height:100%;display:flex;align-items:center;position:relative;text-decoration:none;color:#e3e9ee}
.nav a.active:after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--green);border-radius:4px 4px 0 0}
.nav a:hover{color:var(--green)}
.top-search{margin-left:auto;width:42px;height:42px;border:1px solid #304d69;background:#0b1c2e;border-radius:9px;display:grid;place-items:center;font-size:23px;cursor:pointer}
main{width:min(1320px,calc(100% - 44px));margin:0 auto;padding:0 0 55px}
.hero{min-height:397px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:77px 12px 40px;position:relative}
.hero h1{font-size:clamp(36px,5.3vw,68px);line-height:1.12;letter-spacing:-2.5px;margin:0;text-shadow:0 5px 0 #10181d,0 8px 16px #000b;font-weight:1000}
.hero h1 span{display:block;color:var(--green);font-size:1.08em;text-shadow:0 4px 0 #326c20,0 8px 18px #000b}
.hero p{font-size:17px;font-weight:750;margin:18px 0 27px;text-shadow:0 2px 5px #000}
.searchbox{width:min(850px,100%);height:66px;display:flex;align-items:center;gap:15px;padding:8px 10px 8px 22px;background:rgba(3,13,22,.95);border:2px solid #426b3d;border-radius:13px;box-shadow:0 7px 0 #101b19,0 0 25px #84e3411a}
.searchbox .glass{font-size:28px}
#search{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;font-size:15px}
#search::placeholder{color:#9baab4}
#goSearch{width:48px;height:48px;border:0;border-radius:9px;background:linear-gradient(#b5ff62,#7edc38);color:#17340e;font-size:25px;font-weight:1000;cursor:pointer;box-shadow:0 3px 0 #3c7925}
#suggestions{display:none;position:absolute;z-index:10;top:calc(100% - 34px);width:min(850px,calc(100% - 24px));max-height:300px;overflow:auto;background:#09141deF;border:1px solid #4b6547;border-radius:10px;text-align:left;box-shadow:0 15px 30px #000a}
#suggestions.show{display:block}
.suggestion{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;background:transparent;border:0;text-align:left;cursor:pointer}
.suggestion:hover{background:#203321}
.suggestion img{width:42px;height:42px;object-fit:contain;image-rendering:pixelated}
.suggestion small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.panel{background:linear-gradient(145deg,rgba(5,17,24,.96),rgba(4,13,18,.95));border:1px solid #2d4650;border-radius:16px;padding:20px 24px 25px;box-shadow:0 16px 30px #0006;margin-bottom:22px}
.panel-heading{display:flex;align-items:center;gap:12px;margin:0 0 17px;font-size:25px;font-weight:950;letter-spacing:-.8px}
.panel-heading .mini{font-size:27px}
.panel-heading .more{margin-left:auto;color:var(--green);font-size:13px;font-weight:850;cursor:pointer;background:none;border:0}
.categories{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:16px}
.category{height:137px;border:1px solid #344a55;border-radius:9px;background:linear-gradient(145deg,#172631,#0b151d);box-shadow:inset 0 1px 0 #ffffff0b,0 4px 0 #02080c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.category:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff08,transparent 60%);pointer-events:none}
.category:hover,.category.active{border-color:var(--green);background:linear-gradient(145deg,#203b28,#101c20);transform:translateY(-2px);box-shadow:0 0 18px #8be73a22,0 4px 0 #02080c}
.category img{width:61px;height:61px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 2px #000a)}
.category span{font-size:14px;font-weight:850;text-shadow:0 2px 3px #000}
.popular{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.item-card{border:1px solid #304650;border-radius:11px;background:linear-gradient(145deg,rgba(19,32,41,.98),rgba(6,16,23,.98));padding:14px 15px 13px;min-width:0;box-shadow:0 5px 0 #02070b;transition:.16s;cursor:pointer}
.item-card:hover{transform:translateY(-3px);border-color:#8adf43;box-shadow:0 8px 0 #02070b,0 0 20px #9bea4517}
.item-art{height:108px;display:grid;place-items:center}
.item-art img{width:92px;height:92px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 7px 4px #0009)}
.item-card h3{font-size:16px;margin:0 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;margin-bottom:11px}
.tag{font-size:11px;color:#dce5e9;background:#25343d;border-radius:20px;padding:3px 9px}
.tag.rare{color:#85e9f7;background:#15333b}
.recipe-btn{width:100%;height:39px;border:0;border-radius:9px;background:linear-gradient(#b5ff61,#79d833);color:#17340d;font-weight:950;font-size:13px;cursor:pointer;box-shadow:0 3px 0 #397523}
.recipe-btn:hover{filter:brightness(1.08)}
#results{display:none;margin-top:22px}#results.show{display:block}
.result-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.empty{padding:22px;color:var(--muted);text-align:center}
.recipe-page{display:none;padding-top:25px}.recipe-page.show{display:block}
.back{display:inline-block;padding:10px 15px;border:1px solid #3a5156;background:#0b1920;border-radius:8px;text-decoration:none;margin-bottom:18px;font-size:13px}
.recipe-head{display:flex;align-items:center;gap:22px;padding:25px;border:1px solid #344b50;border-radius:13px;background:#06141deF}
.recipe-head img{width:120px;height:120px;object-fit:contain;image-rendering:pixelated}
.recipe-head h1{margin:0 0 10px;font-size:35px}.recipe-head p{color:var(--muted)}
.recipe-details{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.detail-panel{padding:22px;background:#07141ced;border:1px solid #304750;border-radius:12px}
.detail-panel h2{font-size:19px;margin-top:0}
.craft-grid{display:grid;grid-template-columns:repeat(3,58px);gap:5px;justify-content:center}
.slot{width:58px;height:58px;background:#26333b;border:2px solid #42525a;box-shadow:inset 0 2px 4px #0008;display:grid;place-items:center}
.slot img{width:43px;height:43px;object-fit:contain;image-rendering:pixelated}
.craft-area{display:flex;align-items:center;justify-content:center;gap:24px;padding:22px;background:#0a1820;border-radius:9px}
.craft-arrow{font-size:28px;color:var(--green)}
.material{display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid #283a42}
.material img{width:38px;height:38px;object-fit:contain;image-rendering:pixelated}.material b{margin-left:auto;color:var(--green)}
footer{text-align:center;color:#8b9aa1;padding:26px;font-size:11px;border-top:1px solid #ffffff16;background:#061018aa}
@media(max-width:900px){.topbar{gap:20px}.brand{font-size:18px}.nav{gap:16px}.categories{grid-template-columns:repeat(4,minmax(0,1fr))}.popular,.result-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{min-height:350px;padding-top:66px}}

</style>
</head>

</main>

const $=id=>document.getElementById(id);
function makeImg(id,cls=""){const img=document.createElement("img");img.src=texture(id);img.alt=id;img.className=cls;img.loading="lazy";img.onerror=()=>{img.style.visibility="hidden"};return img}
function norm(s){return String(s||"").toLowerCase().replace(/[\s._-]/g,"")}
function matches(q){const n=norm(q);return items.filter(x=>[x.name,x.id,...x.aliases].some(v=>norm(v).includes(n)))}
function card(item){const el=document.createElement("article");el.className="item-card";el.tabIndex=0;
 const art=document.createElement("div");art.className="item-art";art.append(makeImg(item.id));el.append(art);
 const h=document.createElement("h3");h.textContent=item.name;el.append(h);
 const tags=document.createElement("div");tags.className="tags";const t=document.createElement("span");t.className="tag";t.textContent=item.id.includes("pickaxe")||item.id.includes("sword")?"도구":"블록";tags.append(t);const t2=document.createElement("span");t2.className="tag";t2.textContent="기본";tags.append(t2);el.append(tags);
 const b=document.createElement("button");b.className="recipe-btn";b.textContent="조합법 보기 →";b.onclick=e=>{e.stopPropagation();location.hash="/recipe/"+item.id};el.append(b);el.onclick=()=>location.hash="/recipe/"+item.id;el.onkeydown=e=>{if(e.key==="Enter")location.hash="/recipe/"+item.id};return el}
const categoryData=[
 {name:"무기",id:"diamond_sword",query:"검"},{name:"도구",id:"diamond_pickaxe",query:"곡괭이"},
 {name:"방어구",id:"iron_chestplate",query:"방어구"},{name:"식량",id:"apple",query:"빵"},
 {name:"블록",id:"grass_block",query:"작업대"},{name:"포션",id:"potion",query:"물약"},
 {name:"활 & 화살",id:"bow",query:"활"},{name:"기타",id:"redstone",query:"레드스톤"}
];
function renderCategories(){const host=$("categories");categoryData.forEach(c=>{const b=document.createElement("button");b.className="category";b.append(makeImg(c.id));const label=document.createElement("span");label.textContent=c.name;b.append(label);b.onclick=()=>{if(c.query==="방어구")runSearch("갑옷");else if(c.query==="빵")runSearch("빵");else if(c.query==="물약")runSearch("물약");else runSearch(c.query)};host.append(b)})}
function renderPopular(){const ids=["diamond_pickaxe","crafting_table","chest","torch","furnace","iron_ingot","bow","diamond"];const list=ids.map(id=>items.find(x=>x.id===id)).filter(Boolean);$("popular").replaceChildren(...list.map(card))}
function runSearch(q){$("search").value=q;const found=matches(q);$("resultGrid").replaceChildren();$("results").classList.add("show");if(!found.length){const e=document.createElement("div");e.className="empty";e.textContent="검색 결과가 없어요. 다른 검색어를 입력해 보세요."; $("resultGrid").append(e)}else found.forEach(x=>$("resultGrid").append(card(x)));$("results").scrollIntoView({behavior:"smooth",block:"start"});$("suggestions").classList.remove("show")}
function renderSuggestions(){const host=$("suggestions"),q=$("search").value.trim();host.replaceChildren();if(!q){host.classList.remove("show");return}const found=matches(q).slice(0,6);if(!found.length){host.classList.remove("show");return}found.forEach(item=>{const b=document.createElement("button");b.className="suggestion";b.append(makeImg(item.id));const text=document.createElement("span");text.innerHTML="";const strong=document.createElement("strong");strong.textContent=item.name;const small=document.createElement("small");small.textContent=item.desc;text.append(strong,small);b.append(text);b.onclick=()=>location.hash="/recipe/"+item.id;host.append(b)});host.classList.add("show")}
function renderRecipe(item){$("recipeImage").src=texture(item.id);$("recipeName").textContent=item.name;$("recipeDesc").textContent=item.desc;$("outputImage").src=texture(item.id);$("note").textContent=item.note;const grid=$("craftGrid");grid.replaceChildren();item.grid.forEach(id=>{const slot=document.createElement("div");slot.className="slot";if(id)slot.append(makeImg(id));grid.append(slot)});const mats=$("materials");mats.replaceChildren();item.materials.forEach(([id,name,count])=>{const row=document.createElement("div");row.className="material";row.append(makeImg(id));const label=document.createElement("span");label.textContent=name;const n=document.createElement("b");n.textContent="× "+count;row.append(label,n);mats.append(row)})}
function route(){const m=location.hash.match(/^#\/recipe\/([a-z0-9_]+)$/i);if(m){const item=items.find(x=>x.id===m[1]);if(item){$("home").style.display="none";$("recipePage").classList.add("show");renderRecipe(item);window.scrollTo(0,0);document.title=item.name+" 조합법 | 마인크래프트 아이템 조합법";return}}$("home").style.display="block";$("recipePage").classList.remove("show");document.title="마인크래프트 아이템 조합법"}
$("search").addEventListener("input",renderSuggestions);$("search").addEventListener("keydown",e=>{if(e.key==="Enter")runSearch($("search").value);if(e.key==="Escape")$("suggestions").classList.remove("show")});
$("goSearch").onclick=()=>runSearch($("search").value);$("focusSearch").onclick=()=>$("search").focus();$("showMore").onclick=()=>runSearch("");$("allCategories").onclick=()=>document.querySelector(".categories").scrollIntoView({behavior:"smooth"});
document.addEventListener("click",e=>{if(!e.target.closest(".hero"))$("suggestions").classList.remove("show")});window.addEventListener("hashchange",route);
renderCategories();renderPopular();route();
</script>
</body>
</html>
